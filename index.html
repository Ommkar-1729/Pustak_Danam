<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-card h2 {
            font-size: 1.5rem;
            color: #1f2937;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .login-card p {
            color: #6b7280;
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .error-message {
            color: #dc2626;
            font-size: 0.75rem;
            margin-top: 0.375rem;
            display: none;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:active {
            background-color: #1e40af;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Customer Portal</h2>
        <p>Enter your Customer ID to continue</p>

        <div class="login-container" style="margin-top: 20px; padding: 20px; border: 1px solid #ccc; border-radius: 6px;">
    <h3>Manager Portal</h3>
    <input type="text" id="manager-id-input" placeholder="Enter Manager ID (e.g., MGR-001)" style="padding: 8px; width: 100%; margin-bottom: 10px;">
    <input type="password" id="manager-password-input" placeholder="Enter Password" style="padding: 8px; width: 100%; margin-bottom: 10px;">
    <button type="button" id="manager-login-btn" style="padding: 8px 15px; background-color: #0275d8; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%;">Login as Manager</button>
</div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="customerId">Customer ID</label>
                <input 
                    type="text" 
                    id="customerId" 
                    placeholder="e.g. CUST-010" 
                    required
                    autocomplete="off"
                >
                <div id="errorMsg" class="error-message">Please enter a valid Customer ID.</div>
            </div>
            
            <button type="submit">Login</button>
        </form>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
            const managerLoginBtn = document.getElementById("manager-login-btn");
            if (managerLoginBtn) {
                managerLoginBtn.addEventListener("click", (e) => {
                    e.preventDefault();
                    const managerId = document.getElementById('manager-id-input').value.trim();
                    const managerPassword = document.getElementById('manager-password-input').value.trim();

                    if (managerId === "MGR-001" && managerPassword === "admin123") {
                        window.location.href = `manager.html?id=${encodeURIComponent(managerId)}`;
                    } else {
                        alert("Invalid Manager ID or Password!");
                    }
                });
            }
        });
          
        function handleLogin(event) {
            event.preventDefault();
            
            const customerIdInput = document.getElementById('customerId');
            const errorMsg = document.getElementById('errorMsg');
            const customerId = customerIdInput.value.trim();

            if (!customerId) {
                errorMsg.style.display = 'block';
                customerIdInput.focus();
                return;
            }
            errorMsg.style.display = 'none';
            // Construct the redirect URL dynamically
            const redirectUrl = `customer.html?id=${encodeURIComponent(customerId)}`;
            
            // Redirect to the target page
            window.location.href = redirectUrl;
        }
    </script>

</body>
</html>
